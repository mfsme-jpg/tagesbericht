<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --ink:#0E2233; --ink-2:#27435B; --mute:#6B7F8E;
  --bg:#EEF2F1; --card:#FFFFFF; --line:#D5DEDD;
  --green:#3E9B4F; --green-dk:#2F7A3E; --green-lt:#E8F4E9;
  --amber:#A96A00; --amber-lt:#FCF2E2;
  --red:#B3261E; --red-lt:#FBEAE9;
  --r:14px; --tap:52px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.4; -webkit-text-size-adjust:100%;
  padding-bottom:calc(84px + var(--safe-b));
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.018em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{
  width:100%;background:#F2F5F5;border:1.5px solid transparent;border-radius:11px;
  padding:13px 14px;min-height:var(--tap);appearance:none;outline:none;
}
textarea{min-height:88px;resize:vertical;line-height:1.35}
input:focus,select,textarea:focus{border-color:var(--green);background:#fff}
select{background:#F2F5F5 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236B7F8E' stroke-width='2' fill='none' stroke-linecap='round'/></svg>") no-repeat right 16px center}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
label.f{display:block;margin:16px 0 6px;font-size:13.5px;color:var(--mute);font-weight:600}
label.f:first-child{margin-top:0}

/* header */
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 14px}
.hd{display:flex;align-items:center;gap:12px}
.hd img{height:34px;width:auto;display:block;background:#fff;border-radius:8px;padding:5px 8px}
.hd .t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.hd .s{font-size:12.5px;color:#9FB4C4;margin-top:1px}
.hd .sp{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#6B7F8E;flex:none}
.dot.on{background:#57D06A;box-shadow:0 0 0 3px rgba(87,208,106,.22)}
.dot.off{background:#E0A24B}
.lang{background:rgba(255,255,255,.12);border:none;border-radius:9px;padding:7px 10px;color:#fff;font-size:12.5px;font-weight:700;min-height:0;width:auto}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:14px 0;border:1px solid var(--line)}
.card.flat{padding:0;overflow:hidden}
.ttl{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:18px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:#F2F5F5;border:1.5px solid var(--line);border-radius:999px;
  padding:11px 15px;font-size:15px;font-weight:600;color:var(--ink-2);
  min-height:44px;width:auto;cursor:pointer
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.g[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.chip.a[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
.chip.r[aria-pressed="true"]{background:var(--red);border-color:var(--red)}

/* buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:var(--ink);color:#fff;border:none;border-radius:12px;
  padding:16px;font-size:17px;font-weight:700;min-height:56px;cursor:pointer
}
.btn:active{transform:scale(.988)}
.btn.g{background:var(--green)}
.btn.o{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.d{background:var(--red-lt);color:var(--red);border:1.5px solid #F0CFCD}
.btn[disabled]{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* entry list */
.item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border-bottom:none}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mute);min-width:22px;font-size:15px;padding-top:2px}
.item .b{flex:1;min-width:0}
.item .a1{font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.item .a2{color:var(--mute);font-size:13.5px;margin-top:3px;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:7px;background:#F2F5F5;color:var(--ink-2)}
.tag.g{background:var(--green-lt);color:var(--green-dk)}
.tag.a{background:var(--amber-lt);color:var(--amber)}
.tag.r{background:var(--red-lt);color:var(--red)}
.mini{background:none;border:none;padding:8px;width:auto;min-height:0;color:var(--mute);font-size:14px;font-weight:600;cursor:pointer}
.mini.r{color:var(--red)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(14,34,51,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);
  border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding:8px 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 10px}
.shd{display:flex;align-items:center;margin-bottom:12px}
.shd h2{font-size:19px}
.shd button{margin-left:auto;width:auto;min-height:0;background:none;border:none;color:var(--mute);font-size:15px;font-weight:600;padding:6px;cursor:pointer}

/* tabs */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)
}
nav button{
  flex:1;background:none;border:none;padding:9px 4px 10px;color:var(--mute);
  font-size:11px;font-weight:700;cursor:pointer;min-height:0
}
nav button svg{display:block;margin:0 auto 3px}
nav button[aria-current="true"]{color:var(--green-dk)}
.badge{display:inline-block;min-width:17px;padding:0 4px;background:var(--red);color:#fff;border-radius:9px;font-size:10.5px;line-height:17px;margin-left:4px;vertical-align:1px}

/* table */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
th{background:var(--ink);color:#fff;text-align:left;padding:11px 12px;font-weight:700;font-size:12.5px;position:sticky;top:0}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tr:nth-child(even) td{background:#FAFCFB}
td.w{white-space:normal;min-width:160px}
.st-ok{color:var(--green-dk);font-weight:700}
.st-pd{color:var(--amber);font-weight:700}
.st-no{color:var(--red);font-weight:700}

/* misc */
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kpi span{font-size:12px;color:var(--mute);font-weight:600}
.note{background:var(--green-lt);border:1px solid #CBE5CE;color:var(--green-dk);border-radius:11px;padding:12px 14px;font-size:14px;margin:12px 0}
.note.w{background:var(--amber-lt);border-color:#EFDCBB;color:var(--amber)}
.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:15px;font-weight:600;
  z-index:60;opacity:0;pointer-events:none;transition:.22s;max-width:88%;text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
code.url{display:block;background:#F2F5F5;border-radius:9px;padding:10px;font-size:12px;word-break:break-all;font-family:ui-monospace,Menlo,monospace;margin-top:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- v2 additions --- */
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.login h1{font-size:23px;letter-spacing:-.025em;margin-bottom:6px}
.auto{background:var(--green-lt);border:1px solid #CBE5CE;border-radius:11px;padding:11px 13px;margin-top:14px;font-size:14px;color:var(--green-dk);font-weight:600}
.auto b{font-weight:800}
.tag.auto2{background:#EAF1F6;color:var(--ink-2)}
.diag{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.55;background:#0E2233;color:#CFE3D4;border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word;margin:12px 0}
.who{font-size:12.5px;color:#9FB4C4}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
td.auto3{color:var(--ink-2);opacity:.75}
</style>
</head>
<body style="padding-bottom:40px">

<main class="wrap">

<!-- GİRİŞ -->
<section id="v-login" class="login">
  <div class="box">
    <h1 data-t="adminTitle"></h1>
    <p class="sub" data-t="loginSub"></p>
    <div style="height:14px"></div>
    <label class="f" data-t="loginUser"></label>
    <input id="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
    <label class="f" data-t="pwAsk"></label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <div style="height:12px"></div>
    <button class="btn" id="pwBtn" data-t="enter"></button>
    <p class="sub" style="text-align:center;margin-top:16px" id="loginNote"></p>
  </div>
</section>

<!-- PANEL -->
<section id="v-panel" class="hide">
  <div id="guestBanner" class="note w hide"></div>

  <div class="sel2" style="margin:16px 0 0">
    <input type="date" id="fDate">
    <select id="fTeam"></select>
  </div>
  <div class="row2" style="margin-top:10px">
    <button class="btn o" id="allBtn" type="button"></button>
    <button class="btn d" id="clearAllBtn" type="button"></button>
  </div>
  <div style="height:10px"></div>
  <select id="fPerson"></select>

  <div class="kpi" style="margin:14px 0">
    <div><b id="a1">0</b><span data-t="kTotal"></span></div>
    <div><b id="a2" style="color:var(--green-dk)">0</b><span data-t="kDone"></span></div>
    <div><b id="a3" style="color:var(--red)">0</b><span data-t="kOpen"></span></div>
  </div>

  <div id="note"></div>

  <div class="card flat"><div class="scroll"><table id="tbl"></table></div></div>

  <button class="btn" id="xlsBtn"><span data-t="masterExcel"></span></button>
  <div style="height:10px"></div>
  <button class="btn o" id="refreshBtn" data-t="refresh"></button>

  <div class="card" id="myPwCard" style="margin-top:22px">
    <h2 style="font-size:17px" id="myPwTitle"></h2>
    <p class="sub" id="myPwNote"></p>
    <div id="newUserRow">
      <label class="f" data-t="loginUser"></label>
      <input id="newUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
    </div>
    <label class="f" data-t="newPw"></label>
    <input id="newPw" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div style="height:12px"></div>
    <button class="btn o" id="pwSave" data-t="changePw"></button>
  </div>

  <div class="card">
    <h2 style="font-size:17px" data-t="managers"></h2>
    <div id="stepUp">
      <p class="sub" data-t="stepUpNote"></p>
      <div style="height:10px"></div>
      <input id="stepUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
      <div style="height:10px"></div>
      <div class="row2">
        <input id="stepPw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button class="btn o" id="stepBtn" data-t="verify"></button>
      </div>
    </div>
    <div id="mgrArea" class="hide">
      <div id="mgrList" style="margin:10px -16px 0"></div>
      <label class="f" data-t="mgrName"></label>
      <input id="mgrName" autocomplete="off" autocapitalize="words" spellcheck="false">
      <label class="f" data-t="mgrPw"></label>
      <input id="mgrPw" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <div style="height:12px"></div>
      <button class="btn o" id="mgrAdd" data-t="addMgr"></button>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:17px" data-t="diagTitle"></h2>
    <div style="height:12px"></div>
    <button class="btn o" id="diagBtn" data-t="runDiag"></button>
    <div id="diagOut"></div>
  </div>

  <button class="btn d hide" id="logoutBtn" data-t="logout"></button>
  <p class="sub" style="text-align:center;margin:18px 0 8px" id="verLine"></p>
</section>

</main>

function applyImplications(o){
  const prev = Array.isArray(o._auto) ? o._auto : String(o.auto || "").split(",").filter(Boolean);
  prev.forEach(k => { o[k] = "–"; });
  const auto = [];
  const set = k => { if(!o[k] || o[k] === "–"){ o[k] = "ok"; if(!auto.includes(k)) auto.push(k); } };
  if(o.activation === "ok"){ set("has"); set("blowing"); set("garden"); }
  if(o.has === "ok"){ set("blowing"); set("garden"); }
  if(o.blowing === "ok"){ set("garden"); }
  return auto;
}

}
function notText(e){
  const parts = [];

  if(e.ergebnis) parts.push(e.ergebnis);
  if(e.detail) parts.push(e.detail);
  return parts.join(" — ");
}
function dl(buf, name){
  const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
}

/* ---------------- sunucu ---------------- */
async function apiGet(params){
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(SYNC_URL + "?" + qs, {method:"GET", redirect:"follow"});
  const txt = await r.text();
  try{ return JSON.parse(txt); }
  catch(e){ return {ok:false, error:"not_json", status:r.status, raw:txt.slice(0,300)}; }
}
function chunkRows(rows, maxLen){
  maxLen = maxLen || 5000;
  const out = []; let cur = [];
  for(const r of rows){
    cur.push(r);
    if(JSON.stringify(cur).length > maxLen){ cur.pop(); if(cur.length) out.push(cur); cur = [r]; }
  }
  if(cur.length) out.push(cur);
  return out;
}
async function sendRows(rows){
  try{
    const r = await fetch(SYNC_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({rows}),
      redirect:"follow"
    });
    const txt = await r.text();
    const j = JSON.parse(txt);
    if(j && j.ok) return j;
  }catch(e){ /* POST engellendi -> GET yolunu dene */ }
  try{
    let saved = 0;
    for(const chunk of chunkRows(rows)){
      const j = await apiGet({action:"upsert", payload: JSON.stringify(chunk)});
      if(!j.ok) return j;
      saved += (j.saved || 0);
    }
    return {ok:true, saved, via:"get"};
  }catch(e){ return {ok:false, error:String(e)}; }
}

async function doLogin(user, pw){

      toast(t("wrongCred"));
    } else {
      $("#loginNote").textContent = String(j.error || "").slice(0,120);

      const tip = [r.ts ? t("createdAt")+": "+r.ts : "", r.updated ? t("updatedAt")+": "+r.updated : ""].filter(Boolean).join("  ·  ");
      const arr = r.ts ? new Date(r.ts) : null;
      const arrTxt = (arr && !isNaN(arr)) ? arr.toLocaleString(undefined, {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
      return `<tr>
        <td title="${esc(tip)}">${esc(deDate(r.date))}${arrTxt ? `<div style="color:var(--mute);font-size:11px;margin-top:2px">${esc(arrTxt)}</div>` : ""}</td>
        <td>${esc(r.team)}</td><td>${esc(r.person)}</td><td>${esc(typeLabel(r.type))}</td>
        <td>${esc(r.projekt)}</td><td>${esc(r.nvt)}</td><td>${esc(r.adresse)}</td>
        ${c("garden")}${c("blowing")}${c("splice")}${c("has")}${c("ne4")}${c("activation")}
        <td class="${cellCls(r.ergebnis)}">${esc(r.ergebnis || "–")}</td>
        <td class="w">${esc(r.detail || "")}</td>
        <td>${isGuest ? "" : `<button class="mini" data-edit="${esc(r.id)}">${t("edit")}</button>`}</td></tr>`;
    }).join("") : `<tr><td colspan="16"><div class="empty"><b>${t("noEntries")}</b></div></td></tr>`) +
    `</tbody>`;

  const done = list.filter(r => DONE_SET.has(r.ergebnis)).length;
  $("#a1").textContent = list.length;
  $("#a2").textContent = done;
  $("#a3").textContent = list.length - done;
}
$("#tbl").addEventListener("click", ev => {
  const b = ev.target.closest("[data-edit]");
  if(b) openEdit(b.dataset.edit);
});

/* ---------- kayıt düzenleme ---------- */
function openEdit(id){
  const r = rows.find(x => x.id === id); if(!r) return;
  editId = id; editRec = Object.assign({}, r);
  $("#sheetTitle").textContent = t("editTitle");
  const typeOpts = Object.keys(TYPES).map(k =>
    `<option value="${k}" ${r.type === k ? "selected" : ""}>${esc(typeLabel(k))}</option>`).join("");
  const statusBlock = ORDER.map(k =>
    `<label class="f">${FIELD_NAME(k)}</label><div class="chips" data-fk="${k}">` +
    STATUS.map(s => `<button type="button" class="chip ${s.cls}" data-v="${esc(s.v)}" aria-pressed="${(editRec[k] || "–") === s.v}">${esc(s.lbl)}</button>`).join("") +
    `</div>`).join("");
  $("#sheetBody").innerHTML = `
    <label class="f">${t("fDate")}</label><input type="date" id="e_date" value="${esc(r.date || "")}">
    <label class="f">${t("fTeam")}</label><input id="e_team" value="${esc(r.team || "")}">
    <label class="f">${t("fPerson")}</label><input id="e_person" value="${esc(r.person || "")}">
    <label class="f">${t("fType")}</label><select id="e_type">${typeOpts}</select>
    <label class="f">${t("fProjekt")}</label><input id="e_projekt" value="${esc(r.projekt || "")}">
    <label class="f">${t("fNvt")}</label><input id="e_nvt" value="${esc(r.nvt || "")}">
    <label class="f">${t("fAdresse")}</label><input id="e_adresse" value="${esc(r.adresse || "")}">
    ${statusBlock}
    <label class="f">${t("fErgebnis")}</label><input id="e_ergebnis" value="${esc(r.ergebnis || "")}">
    <label class="f">${t("fDetail")}</label><textarea id="e_detail">${esc(r.detail || "")}</textarea>
    <div style="height:16px"></div>
    <button class="btn g" id="e_save">${t("save")}</button>`;
  $("#sheetBody").querySelectorAll(".chips").forEach(box => {
    box.querySelectorAll(".chip").forEach(btn => btn.onclick = () => {
      editRec[box.dataset.fk] = btn.dataset.v;
      box.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === btn));
    });
  });
  $("#e_save").onclick = saveEdit;
  openSheet();
}
async function saveEdit(){
  if(!editId || !editRec) return;
  const rec = {
    id: editId,
    date: $("#e_date").value.trim() || editRec.date || "",
    team: $("#e_team").value.trim(),
    person: $("#e_person").value.trim(),
    type: $("#e_type").value,
    projekt: $("#e_projekt").value.trim(),
    nvt: $("#e_nvt").value.trim(),
    adresse: $("#e_adresse").value.trim(),
    ergebnis: $("#e_ergebnis").value.trim(),
    detail: $("#e_detail").value.trim()
  };
  ORDER.forEach(k => rec[k] = editRec[k] || "–");
  rec.auto = applyImplications(rec).join(",");
  try{
    const j = await apiGet({action:"edit", auth, row: JSON.stringify(rec)});
    if(j.ok && j.row){
      const i = rows.findIndex(x => x.id === editId);
      if(i >= 0) rows[i] = Object.assign({}, rows[i], j.row);
      closeSheet(); render(); toast(t("edited"));
    } else toast(errMsg(j.error));
  }catch(e){ toast(t("connErr")); }
}
function openSheet(){ $("#veil").classList.add("on"); $("#sheet").classList.add("on"); }
function closeSheet(){ $("#veil").classList.remove("on"); $("#sheet").classList.remove("on"); editId = null; editRec = null; }
$("#veil").onclick = closeSheet; $("#sheetX").onclick = closeSheet;

/* ---------- şifre ve yöneticiler ---------- */
function errMsg(code){
  return ({in_use:t("pwInUse"), too_short:t("pwShort"), no_name:t("errNoName"),
           name_taken:t("errNameTaken"), cannot_remove_self:t("errSelf"),
           unauthorized:t("wrongPw")})[code] || t("connErr");
}
$("#pwSave").onclick = async ()=>{
  const np = $("#newPw").value.trim();
  if(np.length < 4) return toast(t("pwShort"));
  const wasGuest = isGuest;
  try{
    const j = await apiGet({action:"setpw", auth, user: $("#newUser").value.trim(), newpw: np});
    if(j.ok){
      if(wasGuest){
        auth = np; who = j.user; managers = j.managers || []; isGuest = false;
        sessionStorage.setItem(LS+"auth", auth); sessionStorage.setItem(LS+"who", who);
        $("#newPw").value = ""; $("#newUser").value = "";
        showPanel();
        toast(t("pwLocked"));
      } else {
        auth = np; sessionStorage.setItem(LS+"auth", auth);
        $("#newPw").value = "";
        toast(t("pwChanged"));
      }
    } else toast(errMsg(j.error));
  }catch(e){ toast(t("connErr")); }
};

function renderMgrs(){
  $("#mgrList").innerHTML = managers.map(n=>`
    <div class="item">
      <div class="b"><div class="a1">${esc(n)}${n === who ? ` <span class="tag">${t("meLabel")}</span>` : ""}</div></div>
      ${n === who ? "" : `<button class="mini r" data-rm="${esc(n)}">${t("removeMgr")}</button>`}
    </div>`).join("");
  $("#mgrList").querySelectorAll("[data-rm]").forEach(b => b.onclick = ()=>removeMgr(b.dataset.rm));
}
async function loadMgrs(){
  try{
    const j = await apiGet({action:"managers", auth});
    if(j.ok){ managers = j.managers || []; who = j.user || who; renderMgrs(); }
  }catch(e){}
}
async function removeMgr(name){
  if(!confirm(t("confirmRemove") + "\n" + name)) return;
  try{
    const j = await apiGet({action:"delmgr", auth, name});
    if(j.ok){ managers = j.managers || []; renderMgrs(); toast(t("mgrRemoved")); }
    else toast(errMsg(j.error));
  }catch(e){ toast(t("connErr")); }
}
$("#mgrAdd").onclick = async ()=>{
  const name = $("#mgrName").value.trim(), pw = $("#mgrPw").value.trim();
  if(!name) return toast(t("errNoName"));
  if(pw.length < 4) return toast(t("pwShort"));
  try{
    const j = await apiGet({action:"addmgr", auth, name, newpw: pw});
    if(j.ok){
      managers = j.managers || []; renderMgrs();
      $("#mgrName").value = ""; $("#mgrPw").value = "";
      toast(t("mgrAdded"));
    } else toast(errMsg(j.error));
  }catch(e){ toast(t("connErr")); }
};

/* ---------- bağlantı testi ---------- */
$("#diagBtn").onclick = async ()=>{
  const out = $("#diagOut");
  const log = [];
  const put = (s) => { log.push(s); out.innerHTML = `<div class="diag">${esc(log.join("\n"))}</div>`; };
  put("1/3 ping …");
  try{
    const p = await apiGet({action:"ping"});
    if(p.ok) put("1/3 ping        OK\n     tablo: " + p.spreadsheet + "\n     sekme: " + p.sheet + "\n     satir: " + p.rows + "\n     surum: " + p.version + "\n     kilit: " + (p.open ? "ACIK (sifresiz)" : "KAPALI (sifre gerekli)") + "\n     yonetici sayisi: " + p.managers);
    else { put("1/3 ping        HATA\n     " + JSON.stringify(p).slice(0,240) + "\n\n>> Dagitim erisimi 'Herkes' degil, ya da eski surum yayinda."); return; }
  }catch(e){ put("1/3 ping        HATA\n     " + e + "\n\n>> Adres yanlis ya da internet yok."); return; }

  put(log.join("\n") + "\n2/3 yazma …");
  const testRow = {id:"DIAG-TEST", date:"2000-01-01", ts:new Date().toISOString(),
                   person:"diag", team:"diag", type:"has", adresse:"connection test"};
  let w;
  try{ w = await sendRows([testRow]); }catch(e){ w = {ok:false, error:String(e)}; }
  log.pop();
  put((w.ok ? "2/3 yazma       OK" + (w.via === "get" ? "  (GET yolu ile)" : "  (POST yolu ile)")
            : "2/3 yazma       HATA\n     " + JSON.stringify(w).slice(0,240)));

  put(log.join("\n") + "\n3/3 okuma …");
  try{
    const l = await apiGet({action:"list", auth, date:"2000-01-01"});
    log.pop();
    put(l.ok && (l.rows||[]).some(r => r.id === "DIAG-TEST")
        ? "3/3 okuma       OK\n\n>> Her sey calisiyor. Ekiplerin kayitlari tabloya dusuyor."
        : "3/3 okuma       HATA\n     " + JSON.stringify(l).slice(0,240));
  }catch(e){ log.pop(); put("3/3 okuma       HATA\n     " + e); }
};

/* ---------- birleşik excel ---------- */
async function makeMasterExcel(){
  if(typeof ExcelJS === "undefined") return toast(t("excelFail"));
  try{
    const date = $("#fDate").value || todayISO();
    const list = visibleRows();
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("Tagesbericht");
    const H = [t("fDate"),"Team","Person",t("fType"),"Projekt","NVT","Adresse","Gartenbohrung","Blowing","Splice","HAS","NE4","Aktivierung","Ergebnis","Detail"];
    const WD = [12,22,14,20,18,12,30,14,11,11,9,9,13,20,58];

    ws.mergeCells(1,1,1,H.length);
    const h = ws.getCell(1,1);
    h.value = "Netz Intelligenz Deutschland GmbH — " + (allDates ? "Gesamtübersicht" : "Tagesbericht  " + deDate(date));
    h.font = {name:"Calibri", size:14, bold:true, color:{argb:"FFFFFFFF"}};
    h.fill = {type:"pattern", pattern:"solid", fgColor:{argb:"FF0E2233"}};
    h.alignment = {vertical:"middle", indent:1};
    ws.getRow(1).height = 30;

    H.forEach((v,i)=>{
      const c = ws.getCell(2, i+1);
      c.value = v;
      c.font = {name:"Calibri", size:11, bold:true, color:{argb:"FFFFFFFF"}};
      c.fill = {type:"pattern", pattern:"solid", fgColor:{argb:"FF27435B"}};
      c.alignment = {vertical:"middle"};
      c.border = {top:MED,left:MED,bottom:MED,right:MED};
      ws.getColumn(i+1).width = WD[i];
    });
    ws.getRow(2).height = 22;
    ws.views = [{state:"frozen", ySplit:2}];
    ws.autoFilter = {from:{row:2,column:1}, to:{row:2,column:H.length}};

    list.forEach((r,i)=>{
      const rn = 3+i;
      const au = new Set(String(r.auto||"").split(",").filter(Boolean));
      const vals = [deDate(r.date), r.team, r.person, typeLabel(r.type), r.projekt, r.nvt, r.adresse,
                    (r.garden||"–")+(au.has("garden")?"°":""), (r.blowing||"–")+(au.has("blowing")?"°":""),
                    (r.splice||"–")+(au.has("splice")?"°":""), (r.has||"–")+(au.has("has")?"°":""),
                    (r.ne4||"–")+(au.has("ne4")?"°":""), (r.activation||"–")+(au.has("activation")?"°":""),
                    r.ergebnis||"", r.detail||""];
      vals.forEach((v,ci)=>{
        const c = ws.getCell(rn, ci+1);
        c.value = v ?? "";
        c.font = {name:"Calibri", size:11};
        c.alignment = {vertical:"middle", wrapText: ci === 14};
        c.border = {top:MED,left:MED,bottom:MED,right:MED};
        if(ci >= 7){
          const s = String(v||"").replace("°","");
          if(DONE_SET.has(s)) c.font = {name:"Calibri", size:11, bold:true, color:{argb:"FF2F7A3E"}};
          else if(s === "Pending") c.font = {name:"Calibri", size:11, bold:true, color:{argb:"FFA96A00"}};
          else if(s && s !== "–" && s !== "N/A") c.font = {name:"Calibri", size:11, bold:true, color:{argb:"FFB3261E"}};
        }
        if(i % 2) c.fill = {type:"pattern", pattern:"solid", fgColor:{argb:"FFF4F8F6"}};
      });
      ws.getRow(rn).height = Math.max(22, Math.min(120, Math.ceil(String(r.detail||"").length/56)*16 || 22));
    });

    const note = ws.getCell(3 + list.length + 1, 1);
    note.value = "°  = otomatik tamamlandı / automatisch ergänzt";
    note.font = {name:"Calibri", size:10, italic:true, color:{argb:"FF6B7F8E"}};

    dl(await wb.xlsx.writeBuffer(), (allDates ? "Gesamt-Übersicht" : `Gesamt-${shortDate(date)}`) + ".xlsx");
    toast(t("excelReady"));
  }catch(err){ console.error(err); toast(t("excelFail")); }
}
$("#xlsBtn").onclick = makeMasterExcel;
